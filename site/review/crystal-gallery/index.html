function dimensions(){W=$('stage').clientWidth;H=$('stage').clientHeight;base=Math.min(W/900,H/900);if(W>1000)base=Math.min((W-320)/850,H/940);$('graph').setAttribute('viewBox',`0 0 ${W} ${H}`)}
function update(){const k=base*scale,cx=W/2+(W>1100?45:0);$('world').setAttribute('transform',`translate(${cx+tx} ${H/2-15+ty}) scale(${k})`);labelNodes.forEach((g,i)=>{g.querySelector('text').setAttribute('font-size',W<680?12/k:13/k);g.querySelector('.sub').setAttribute('font-size',9/k);g.querySelector('.sub').setAttribute('y',17/k);g.querySelector('rect').setAttribute('transform',`scale(${1/k})`);g.style.opacity=selected>=0&&selected!==i?.28:1});terminalLabels.forEach(l=>{const visible=(selected===+l.dataset.b&&scale>1.2)||scale>2.2;l.style.display=visible?'':'none';l.setAttribute('font-size',11/k);l.setAttribute('stroke-width',3/k)});document.querySelectorAll('.data-node').forEach(n=>{n.style.opacity=selected>=0&&selected!==+n.dataset.b?.25:1;n.querySelector('.node-halo').setAttribute('r',Math.max(17,18/k));n.querySelector('.node-body').setAttribute('r',Math.max(4,3.3/k));n.querySelector('.node-core').setAttribute('r',Math.max(1.1,1/k))});document.querySelectorAll('.branch-art').forEach(g=>g.style.opacity=selected>=0&&selected!==+g.dataset.branch?.21:1);$('zoom').textContent=Math.round(scale*100)+'%'}
function focusBranch(i,trigger){selected=i;itemSelected=-1;returnTarget=trigger||labelNodes[i];const p=polar(200,-Math.PI/2+i*TAU/8);scale=W<680?1.85:1.8;tx=-p[0]*base*scale+(W>680?-100:0);ty=-p[1]*base*scale+(W<680?-95:0);update();showDetail();$('status').textContent=`已靠近${DATA[i].name}`}
function showDetail(){const b=DATA[selected];$('detail').hidden=false;let html=`<small>关系需要 / ${b.items.length} 个探索点</small><h2 tabindex="-1">${itemSelected<0?b.name:b.items[itemSelected][0]}</h2><p>${itemSelected<0?b.desc:b.items[itemSelected][1]+'。'}</p>`;if(itemSelected<0)html+=`<div class="detail-items">${b.items.map((it,j)=>`<button data-item="${j}">${it[0]}<span>↗</span></button>`).join('')}</div>`;else html+=`<p class="prompt">在最近的一段相处里，<br>这份需要有被看见吗？</p><button class="back" id="backBranch">← ${b.name}的全部需要</button>`;$('detailContent').innerHTML=html;$('detailContent').querySelector('h2').focus({preventScroll:true});$('detailContent').querySelectorAll('[data-item]').forEach(n=>n.onclick=()=>{itemSelected=+n.dataset.item;showDetail()});if($('backBranch'))$('backBranch').onclick=()=>{itemSelected=-1;showDetail()}}
function openItem(i,j,trigger){focusBranch(i,trigger);itemSelected=j;showDetail();$('status').textContent=DATA[i].items[j][0]+'：'+DATA[i].items[j][1]}
function reset(restore=false){selected=-1;itemSelected=-1;scale=1;tx=ty=0;$('detail').hidden=true;update();if(restore&&returnTarget?.isConnected)returnTarget.focus();$('status').textContent='已回到完整图谱'}
function setMode(m){mode=m;document.body.dataset.style=m;document.querySelectorAll('[data-mode]').forEach(n=>n.setAttribute('aria-pressed',n.dataset.mode===m));$('eyebrow').textContent={ice:'CRYSTAL / 冰晶',frost:'HOARFROST / 羽霜',paper:'PAPER / 纸境'}[m];$('subtitle').innerHTML={ice:'靠近一点，<br>看见关系里细微的自己。',frost:'让心事慢慢舒展，<br>每一份需要都值得被温柔看见。',paper:'一层一层，<br>打开关系里柔软的深处。'}[m];render();reset();history.replaceState(null,'','#'+m)}
$('plus').onclick=()=>{scale=Math.min(3.4,scale*1.25);update()};$('minus').onclick=()=>{scale=Math.max(.7,scale/1.25);update()};$('reset').onclick=()=>reset();$('close').onclick=()=>reset(true);document.querySelectorAll('[data-mode]').forEach(n=>n.onclick=()=>setMode(n.dataset.mode));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('mobilePreview').classList.contains('active'))closePhone();else reset(true)}});
const svg=$('graph');let prevPinch=0,lastMove=null,panOrigin=null,pinchMid=null;
svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);lastMove=[e.clientX,e.clientY];panOrigin=[e.clientX,e.clientY];dragged=false;if(pointers.size===2){const p=[...pointers.values()];prevPinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);pinchMid=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2]}});
svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);const next=Math.max(.7,Math.min(3.4,scale*d/prevPinch)),mid=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2],rect=svg.getBoundingClientRect(),px=pinchMid[0]-rect.left-W/2-(W>1100?45:0),py=pinchMid[1]-rect.top-H/2+15;tx=px-(px-tx)*next/scale+mid[0]-pinchMid[0];ty=py-(py-ty)*next/scale+mid[1]-pinchMid[1];scale=next;prevPinch=d;pinchMid=mid;dragged=true}else{const dx=e.clientX-old[0],dy=e.clientY-old[1];if(!dragged&&panOrigin&&Math.hypot(e.clientX-panOrigin[0],e.clientY-panOrigin[1])>6){dragged=true;svg.setPointerCapture(e.pointerId);}if(dragged){tx+=dx;ty+=dy}}update()});
function endPointer(e){pointers.delete(e.pointerId);if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);setTimeout(()=>dragged=false,100)}svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);svg.addEventListener('wheel',e=>{e.preventDefault();const next=Math.max(.7,Math.min(3.4,scale*Math.exp(-e.deltaY*.0015)));const rect=svg.getBoundingClientRect(),px=e.clientX-rect.left-W/2-(W>1100?45:0),py=e.clientY-rect.top-H/2+15;tx=px-(px-tx)*next/scale;ty=py-(py-ty)*next/scale;scale=next;update()},{passive:false});
window.addEventListener('resize',()=>{dimensions();update()});$('phone').onclick=()=>{$('phoneFrame').src=location.pathname+'?embed=1#'+mode;$('mobilePreview').classList.add('active');$('mobilePreview').showModal();$('phoneClose').focus()};function closePhone(){$('mobilePreview').classList.remove('active');$('mobilePreview').close();$('phoneFrame').src='about:blank';$('phone').focus()}$('phoneClose').onclick=closePhone;$('mobilePreview').addEventListener('cancel',e=>{e.preventDefault();closePhone()});if(new URLSearchParams(location.search).has('embed'))$('phone').remove();dimensions();setMode(['ice','frost','paper'].includes(location.hash.slice(1))?location.hash.slice(1):'ice');
</script></body></html>
