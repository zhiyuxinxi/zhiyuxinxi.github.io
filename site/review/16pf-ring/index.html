</style></head><body><header><span>向内看见 / 人格图谱</span><span class="sample">合成示例 · 非测评结果</span></header><div class="layout"><section class="intro"><small>Sixteen facets of self</small><h1>十六面<br>的自己</h1><p>不同的倾向，<br>共同构成一个完整的我。</p><div class="rule"></div><p class="caption">16PF · 十六种人格因素<br>分数没有好坏，只有不同方向。<br>点选一面，慢慢看。</p></section><main class="stage" id="stage"><svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="16PF 十六因子环形画像，可拖动缩放"><defs><linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset=".24" stop-color="#eef5f5" stop-opacity=".75"/><stop offset=".67" stop-color="#b9ced1" stop-opacity=".7"/><stop offset=".89" stop-color="#dbe7e7" stop-opacity=".85"/><stop offset="1" stop-color="#f8fcfb"/></linearGradient><radialGradient id="core"><stop stop-color="#fcfdfb" stop-opacity=".92"/><stop offset=".82" stop-color="#f4f8f6" stop-opacity=".7"/><stop offset="1" stop-color="#d3e0e1" stop-opacity=".25"/></radialGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a7f86" flood-opacity=".12"/></filter><filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter></defs><g id="world"><circle r="223" cy="12" fill="#8caeb4" opacity=".11" filter="url(#halo)"/><g id="art"></g><g id="labels"></g><g id="center"><circle r="105" fill="url(#core)"/><circle r="94" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".7"/><text y="3" text-anchor="middle" font-family="var(--serif)" font-size="31" fill="#46616b">我</text><text y="29" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing="2.4" fill="#738b91">SIXTEEN FACETS</text></g></g></svg><aside class="detail" id="detail" hidden aria-label="因子详情"><button class="close" id="close" aria-label="关闭详情">×</button><div id="detailContent"></div></aside><div class="toolbar" aria-label="图谱操作"><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">+</button><button id="reset">回到全貌</button></div><p id="status" class="sr" role="status" aria-live="polite"></p></main></div><footer class="foot"><div><span class="pearl"></span>圆点：示例标准十分（Sten 1–10）<span class="secondary"> · 内侧 1 → 外侧 10</span></div><div>完整圆环不随分数变化 · 点击查看两端倾向</div><button id="phone">手机预览</button></footer><dialog id="mobilePreview" aria-label="手机布局预览"><iframe id="phoneFrame" title="390 像素手机预览"></iframe><button id="phoneClose">关闭预览</button></dialog><script>
'use strict';
const DATA=[
['A','乐群性','Warmth',7,'较为保留','较为热情','描述与他人建立亲近联系时，较为保留或主动亲近的倾向。'],
['B','聪慧性','Reasoning',6,'偏具体思维','抽象推理较强','这一因子涉及推理题的表现，与其余人格倾向不同。分数需结合测验条件、语言与教育背景解释，不等同于完整的智力评估。'],

['I','敏感性','Sensitivity',7,'重实用客观','重感受体验','描述判断事物时，更侧重实用和客观依据，还是情感与审美体验。'],
['L','怀疑性','Vigilance',3,'较易信任','保持警觉','描述对他人意图，倾向于信任还是保持审慎与警觉。'],
['M','幻想性','Abstractedness',8,'关注现实','沉浸想象','描述注意力偏向现实细节，还是内在想法与想象。'],
['N','世故性','Privateness',5,'坦率表达','谨慎披露','描述向他人表达自己时，更直接坦率，还是更重视保留与隐私。'],
['O','忧虑性','Apprehension',4,'较有自信','容易担忧','描述自我评价时，较为安心笃定或更容易自我怀疑与担忧的倾向。'],
['Q1','实验性','Openness to Change',7,'偏好熟悉','愿意尝新','描述面对新想法与变化时，偏好熟悉方式还是愿意探索新可能。'],
['Q2','独立性','Self-Reliance',6,'偏好协作','偏好独立','描述做事时，更偏好与人一起，还是独立思考与完成。'],

function dimensions(){W=$('stage').clientWidth;H=$('stage').clientHeight;base=Math.min((W-(W>1050?310:W>680?190:18))/650,(H-110)/650);$('graph').setAttribute('viewBox',`0 0 ${W} ${H}`)}function cx(){return W/2+(W>1050?90:W>680?55:0)}

function showDetail(){const d=DATA[selected];$('detail').hidden=false;$('detailContent').innerHTML=`<small>16PF / 因子 ${d.code}</small><h2 tabindex="-1">${d.name}</h2><div class="english">${d.en}</div><div class="value"><strong>${d.score}</strong><span>Sten / 合成示例</span></div><div class="axis" role="img" aria-label="标准十分 ${d.score}，1 ${d.low}，10 ${d.high}">${Array.from({length:10},(_,j)=>`<span class="tick">${j+1}</span>`).join('')}<span class="indicator" style="left:${(d.score-1)*100/9}%"></span></div><div class="poles"><span>${d.low}</span><span>${d.high}</span></div><p>${d.desc}</p><p class="note">仅展示视觉，不是个人测评或诊断。真实结果应依据正式版本、适用常模及专业解读；高低分不代表人的价值。</p><nav class="detail-nav" aria-label="切换因子"><button id="previous">← 上一面</button><button id="next">下一面 →</button></nav>`;$('previous').onclick=()=>focusFactor((selected+15)%16);$('next').onclick=()=>focusFactor((selected+1)%16);$('detailContent').querySelector('h2').focus({preventScroll:true})}
function reset(focus=false){selected=-1;scale=1;tx=ty=0;$('detail').hidden=true;document.body.classList.remove('exploring');update();if(focus&&returnTarget)returnTarget.focus({preventScroll:true})}$('plus').onclick=()=>{scale=Math.min(3,scale*1.2);update()};$('minus').onclick=()=>{scale=Math.max(.75,scale/1.2);update()};$('reset').onclick=()=>reset();$('close').onclick=()=>reset(true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('mobilePreview').open)closePhone();else reset(true)}});
