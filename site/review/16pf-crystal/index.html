</style></head><body><header><span>向内看见 / 人格图谱</span><span class="sample">合成示例 · 非测评结果</span></header><section class="intro"><small>Sixteen facets of self</small><h1>十六面<br>的自己</h1><p>每一片晶瓣，是一个观察的方向。<br>靠近一点，看见细微的不同。</p><div class="line"></div><p class="caption">16PF · 十六种人格因素<br>完整的花，不因分数而缺失。<br>晶点的位置，记录不同倾向。</p></section><main class="stage" id="stage"><svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="16PF 十六因子冰晶花，可拖动和缩放"><defs><linearGradient id="ice" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#e2f2fc"/><stop offset=".53" stop-color="#94b8cf" stop-opacity=".75"/><stop offset=".72" stop-color="#f5fcff"/><stop offset="1" stop-color="#b5d0df" stop-opacity=".6"/></linearGradient><radialGradient id="heart"><stop stop-color="#fff"/><stop offset="1" stop-color="#bdd8e7"/></radialGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#507b98" flood-opacity=".2"/></filter></defs><g id="world"><g id="art"></g><g id="nodes"></g><g id="labels"></g><g id="center"></g></g></svg><aside class="detail" id="detail" hidden aria-label="因子详情"><button class="close" id="close" aria-label="关闭详情">×</button><div id="detailContent"></div></aside><div class="toolbar" aria-label="图谱操作"><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">+</button><button id="reset">回到全貌</button></div><p id="status" class="sr" role="status" aria-live="polite"></p></main><footer class="foot"><div><span class="pearl"></span>晶点：示例标准十分（Sten 1–10）<span class="secondary"> · 内侧 1 → 外侧 10</span></div><div>点击晶瓣或晶点查看解释 · 拖动与双指缩放</div><button id="phone">手机预览</button></footer><dialog id="mobilePreview" aria-label="手机布局预览"><iframe id="phoneFrame" title="390 像素手机预览"></iframe><button id="phoneClose">关闭预览</button></dialog><script>
'use strict';

const DATA=[
['A','乐群性','Warmth',7,'较为保留','较为热情','描述与他人建立亲近联系时，较为保留或主动亲近的倾向。'],
['B','聪慧性','Reasoning',6,'偏具体思维','抽象推理较强','这一因子涉及推理题的表现，与其余人格倾向不同。分数需结合测验条件、语言与教育背景解释，不等同于完整的智力评估。'],
['C','稳定性','Emotional Stability',5,'容易受影响','情绪较稳定','描述面对生活压力时，情绪反应和稳定应对的倾向。'],
['E','恃强性','Dominance',4,'较为配合','倾向主导','描述互动中配合他人，或主动表达立场、影响决定的倾向。'],
['F','兴奋性','Liveliness',8,'严肃审慎','活泼自发','描述日常表达中，偏向严肃克制或活泼自发的风格。'],

['H','敢为性','Social Boldness',4,'社交较谨慎','社交较大胆','描述在社交场合中，面对陌生人或成为注意焦点时的表现倾向。'],
['I','敏感性','Sensitivity',7,'重实用客观','重感受体验','描述判断事物时，更侧重实用和客观依据，还是情感与审美体验。'],
['L','怀疑性','Vigilance',3,'较易信任','保持警觉','描述对他人意图，倾向于信任还是保持审慎与警觉。'],
['M','幻想性','Abstractedness',8,'关注现实','沉浸想象','描述注意力偏向现实细节，还是内在想法与想象。'],
['N','世故性','Privateness',5,'坦率表达','谨慎披露','描述向他人表达自己时，更直接坦率，还是更重视保留与隐私。'],
['O','忧虑性','Apprehension',4,'较有自信','容易担忧','描述自我评价时，较为安心笃定或更容易自我怀疑与担忧的倾向。'],
['Q1','实验性','Openness to Change',7,'偏好熟悉','愿意尝新','描述面对新想法与变化时，偏好熟悉方式还是愿意探索新可能。'],
['Q2','独立性','Self-Reliance',6,'偏好协作','偏好独立','描述做事时，更偏好与人一起，还是独立思考与完成。'],
['Q3','自律性','Perfectionism',5,'容许不规整','追求有序','描述在组织和安排事情时，容许灵活不规整或倾向秩序与周全的风格。'],
['Q4','紧张性','Tension',3,'较为放松','内在紧绷','描述日常体验中的放松程度，以及内在紧迫感与张力。']
].map(([code,name,en,score,low,high,desc])=>({code,name,en,score,low,high,desc}));
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',TAU=Math.PI*2;let selected=-1,scale=1,base=1,tx=0,ty=0,W=0,H=0,dragged=false,returnTarget=null;const pointers=new Map(),labelNodes=[],nodeNodes=[];function el(t,a={},p){const n=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);if(p)p.append(n);return n}function path(d,a,p){return el('path',{d,...a},p)}function polar(r,a){return[r*Math.cos(a),r*Math.sin(a)]}function pt(p){return p.join(',')}function ang(i){return -Math.PI/2+i*TAU/16}
function crystal(parent,x,y,a,len,w){const g=el('g',{transform:`translate(${x} ${y}) rotate(${a})`},parent);path(`M0 0 L${len*.28} ${-w/2} L${len*.81} ${-w*.22} L${len} 0 L${len*.81} ${w*.22} L${len*.28} ${w/2}Z`,{fill:'url(#ice)',stroke:'#f5fcff','stroke-width':.65},g);path(`M0 0 L${len} 0 L${len*.81} ${w*.22} L${len*.28} ${w/2}Z`,{fill:'#8fadc5','fill-opacity':.22},g);path(`M0 0 L${len} 0`,{stroke:'#ffffff','stroke-width':.65,fill:'none'},g);return g}
function render(){DATA.forEach((d,i)=>{const a=ang(i),g=el('g',{class:'branch',transform:`rotate(${a*180/Math.PI})`,filter:'url(#shadow)'},$('art'));
// Sixteen complete, equal-length faceted fronds. Decorative structure does not encode score.
crystal(g,43,0,0,274,18);for(let j=0;j<8;j++){const x=84+j*27,len=[22,31,43,51,57,54,42,25][j];for(const side of[-1,1]){const b=crystal(g,x,0,side*39,len,7-j*.35);for(let k=1;k<4;k++)crystal(b,len*(.25+k*.16),0,side*40,len*(.27-k*.045),2.8)}}for(let j=0;j<4;j++){const x=92+j*55;path(`M${x-12} 0 L${x} -8 L${x+17} 0 L${x} 8Z`,{fill:'url(#ice)',stroke:'#fff','stroke-width':.6},g)}
const axis=el('g',{},g);path('M90 0H285',{stroke:'#719aad','stroke-width':.9,'stroke-dasharray':'1 5',fill:'none'},axis);for(let j=0;j<10;j++)el('circle',{cx:90+j*195/9,cy:0,r:1.15,fill:'#7295ac','fill-opacity':.55},axis);
const known=Number.isFinite(d.score),r=known?90+(d.score-1)*195/9:326,p=polar(r,a),node=el('g',{class:'node',transform:`translate(${pt(p)})`,role:'button',tabindex:'-1','aria-label':`${d.code} ${d.name}，${known?'示例 '+d.score+' 分':'未测'}`},$('nodes'));el('circle',{class:'hit',r:17},node);el('circle',{class:'orb',r:5.7,fill:known?'#f9ffff':'none',stroke:'#4e839d','stroke-width':1.5,'stroke-dasharray':known?'':'2 2'},node);if(known)el('circle',{r:2,fill:'#4c879c'},node);nodeNodes.push(node);node.onclick=e=>{e.stopPropagation();if(!dragged)focusFactor(i,labelNodes[i])};
const l=el('g',{class:'factor',role:'button',tabindex:'0','aria-label':`${d.code} ${d.name}，${known?'示例标准十分 '+d.score:'未测'}，查看解释`},$('labels'));el('rect',{class:'hit',x:-44,y:-22,width:88,height:44,rx:8,fill:'transparent'},l);el('text',{class:'name',y:0},l).textContent=d.name;el('text',{class:'code',y:17},l).textContent=d.code+' · '+(known?d.score:'未测');l.onclick=e=>{e.stopPropagation();if(!dragged)focusFactor(i,l)};l.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();focusFactor(i,l)}else if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();labelNodes[(i+(e.key==='ArrowRight'?1:15))%16].focus()}};labelNodes.push(l)});
const c=$('center');el('polygon',{points:Array.from({length:16},(_,i)=>pt(polar(45,ang(i)+Math.PI/16))).join(' '),fill:'url(#heart)',stroke:'#fff','stroke-width':1.2,filter:'url(#shadow)'},c);el('circle',{r:32,fill:'none',stroke:'#fff','stroke-width':.7},c);el('text',{y:8,'text-anchor':'middle','font-family':'var(--serif)','font-size':25,fill:'#375c72'},c).textContent='我';}
function dimensions(){W=$('stage').clientWidth;H=$('stage').clientHeight;base=Math.min((W-(W>1000?280:25))/820,(H-110)/820);$('graph').setAttribute('viewBox',`0 0 ${W} ${H}`)}
function update(){const k=base*scale,cx=W/2+(W>1000?95:0);$('world').setAttribute('transform',`translate(${cx+tx} ${H/2-15+ty}) scale(${k})`);labelNodes.forEach((g,i)=>{const a=ang(i),p=polar(365,a);g.setAttribute('transform',`translate(${pt(p)}) scale(${1/k})`);g.querySelector('.name').setAttribute('font-size',W<680?11:13);g.querySelector('.code').setAttribute('font-size',9);g.classList.toggle('active',selected===i)});nodeNodes.forEach((n,i)=>{n.classList.toggle('active',selected===i);n.querySelector('.hit').setAttribute('r',Math.max(17,16/k));n.querySelector('.orb').setAttribute('r',Math.max(5.7,3.4/k))});$('zoom').textContent=Math.round(scale*100)+'%';document.querySelectorAll('.branch').forEach((g,i)=>g.style.opacity=selected>=0&&selected!==i?.36:1)}
function focusFactor(i,trigger){selected=i;returnTarget=trigger||labelNodes[i];document.body.classList.add('exploring');const p=polar(190,ang(i));scale=W<680?2.2:1.8;tx=-p[0]*base*scale+(W>680?-125:0);ty=-p[1]*base*scale+(W<680?-125:0);update();showDetail();$('status').textContent=`正在查看 ${DATA[i].name}，合成示例`}
function showDetail(){const d=DATA[selected],known=Number.isFinite(d.score);$('detail').hidden=false;$('detailContent').innerHTML=`<small>16PF / 因子 ${d.code}</small><h2 tabindex="-1">${d.name}</h2><div class="english">${d.en}</div><div class="value"><strong>${known?d.score:'—'}</strong><span>${known?'Sten / 合成示例':'未测 / 无数据'}</span></div><div class="scale">${Array.from({length:10},(_,j)=>`<span class="${known&&j+1===d.score?'on':''}">${j+1}</span>`).join('')}</div><div class="poles"><span>1 · ${d.low}</span><span>${d.high} · 10</span></div><p>${d.desc}</p><p class="note">分数不是人的价值排序。此处仅演示视觉，不用于诊断或个人判断；真实解读需结合正式测评。</p><div class="detail-nav"><button id="previous">← 上一个因子</button><button id="next">下一个因子 →</button></div>`;$('previous').onclick=()=>focusFactor((selected+15)%16);$('next').onclick=()=>focusFactor((selected+1)%16);$('detailContent').querySelector('h2').focus({preventScroll:true})}
function reset(focus=false){selected=-1;scale=1;tx=ty=0;$('detail').hidden=true;document.body.classList.remove('exploring');update();if(focus&&returnTarget)returnTarget.focus({preventScroll:true})}
$('plus').onclick=()=>{scale=Math.min(3.4,scale*1.25);update()};$('minus').onclick=()=>{scale=Math.max(.7,scale/1.25);update()};$('reset').onclick=()=>reset();$('close').onclick=()=>reset(true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('mobilePreview').open)closePhone();else reset(true)}});
const svg=$('graph');let prevPinch=0,lastMove=null,panOrigin=null,pinchMid=null;
svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);lastMove=[e.clientX,e.clientY];panOrigin=[e.clientX,e.clientY];dragged=false;if(pointers.size===2){const p=[...pointers.values()];prevPinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);pinchMid=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2]}});
svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);const next=Math.max(.7,Math.min(3.4,scale*d/prevPinch)),mid=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2],rect=svg.getBoundingClientRect(),px=pinchMid[0]-rect.left-W/2-(W>1000?95:0),py=pinchMid[1]-rect.top-H/2+15;tx=px-(px-tx)*next/scale+mid[0]-pinchMid[0];ty=py-(py-ty)*next/scale+mid[1]-pinchMid[1];scale=next;prevPinch=d;pinchMid=mid;dragged=true}else{const dx=e.clientX-old[0],dy=e.clientY-old[1];if(!dragged&&panOrigin&&Math.hypot(e.clientX-panOrigin[0],e.clientY-panOrigin[1])>6){dragged=true;svg.setPointerCapture(e.pointerId);}if(dragged){tx+=dx;ty+=dy}}update()});
function endPointer(e){pointers.delete(e.pointerId);if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);setTimeout(()=>dragged=false,100)}svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);svg.addEventListener('wheel',e=>{e.preventDefault();const next=Math.max(.7,Math.min(3.4,scale*Math.exp(-e.deltaY*.0015)));const rect=svg.getBoundingClientRect(),px=e.clientX-rect.left-W/2-(W>1000?95:0),py=e.clientY-rect.top-H/2+15;tx=px-(px-tx)*next/scale;ty=py-(py-ty)*next/scale;scale=next;update()},{passive:false});

</script></body></html>
