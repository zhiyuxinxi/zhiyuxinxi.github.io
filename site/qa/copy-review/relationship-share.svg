<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960"><rect width="900" height="960" rx="40" fill="#f7f9f2"/><circle cx="770" cy="160" r="175" fill="#e4ead8"/><g fill="#263d34" font-family="system-ui,sans-serif"><text x="72" y="115" font-size="26">知遇测评</text><text x="72" y="175" font-size="24">人际相处</text><text x="72" y="280" font-size="57">熟悉之后，</text><text x="72" y="365" font-size="57">慢慢打开自己。</text><text x="72" y="500" font-size="28">回应一个细节，也是一种参与。</text><text x="72" y="552" font-size="28"></text><path d="M72 704H828" stroke="#bbc6b4"/><text x="72" y="776" font-size="24">不含私人资料</text><text x="72" y="822" font-size="24">不含姓名与本人补充</text></g></svg>