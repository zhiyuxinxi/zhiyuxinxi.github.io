name: Verify deployed living tide
on:
  push:
    branches: [verify/zhiyu-living-tide]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify public deployed bytes and original record loop
        run: python site/tools/public_release_smoke.py
      - name: Verify public full tide cycle and live continuity
        run: python site/tools/tidal_motion.py site
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-tide-public-release
          path: |
            site/qa/live-release
            site/qa/living-tide
          retention-days: 14
