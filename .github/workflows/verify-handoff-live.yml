name: Verify published page handoff
on:
  push:
    branches: [verify/zhiyu-handoff-live]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual public root and documentation
        run: python tools/verify_handoff_live.py
      - name: Preserve real public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-page-handoff
          path: live-handoff-evidence
          retention-days: 14
