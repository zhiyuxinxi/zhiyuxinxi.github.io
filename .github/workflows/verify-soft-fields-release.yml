name: Verify deployed soft-field release
on:
  push:
    branches: [verify/zhiyu-soft-fields-release]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify published resource hashes and original record loop
        run: python site/tools/public_release_smoke.py
      - name: Verify live six-entry UI and isolated preview state
        if: always()
        run: python site/tools/six_paths_ui.py site
      - name: Verify live twelve-theme area contrast direction and continuity
        if: always()
        run: python site/tools/tidal_motion.py site
      - name: Verify live twelve-theme selected and unselected navigation
        if: always()
        run: python site/tools/nav_contrast.py site
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-fields-public-release
          path: |
            site/qa/live-release
            site/qa/six-paths-ui
            site/qa/soft-fields-restored
            site/qa/nav-contrast
          retention-days: 14
