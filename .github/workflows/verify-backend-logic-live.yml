name: Verify published backend logic reader
on:
  push:
    branches: [verify/zhiyu-backend-logic-live]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check actual public source hashes
        run: python tools/verify_backend_logic_hashes.py
      - name: Exercise actual published reader
        env:
          PUBLIC_LOGIC_URL: https://zhiyuxinxi.github.io
        run: python site/tools/backend_logic_test.py site
      - name: Preserve public screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-backend-logic-reader
          path: site/qa/backend-logic
          retention-days: 14
