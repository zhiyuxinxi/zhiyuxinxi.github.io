name: Verify deployed tidal release
on:
  push:
    branches: [verify/zhiyu-tidal-release]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual public release in isolated browser
        run: python site/tools/public_release_smoke.py
      - name: Preserve public release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-public-release
          path: site/qa/live-release
          retention-days: 7
