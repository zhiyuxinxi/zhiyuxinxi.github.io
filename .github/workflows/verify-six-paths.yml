name: Verify deployed six-path UI
on:
  push:
    branches: [verify/zhiyu-six-paths]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify published bytes and original record loop
        run: python site/tools/public_release_smoke.py
      - name: Verify live six-entry UI and isolated preview states
        run: python site/tools/six_paths_ui.py site
      - name: Verify live decoupled tide and cross-page continuity
        run: python site/tools/tidal_motion.py site
      - name: Preserve actual public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-paths-public-release
          path: |
            site/qa/live-release
            site/qa/six-paths-ui
            site/qa/six-paths-motion
          retention-days: 14
