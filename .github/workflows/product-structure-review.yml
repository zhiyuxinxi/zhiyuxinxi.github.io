name: Review product structure candidate
on:
  push:
    branches: ['design/product-structure-*']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium firefox
          sudo apt-get install -y fonts-noto-cjk xvfb xdotool
      - name: Verify canonical catalogs and local record contracts
        run: |
          python site/tools/build_workbench.py
          git diff --exit-code -- site/workbench-data.js
          node site/tools/record_loop_contract.mjs site
      - name: Verify current product structure and safety
        run: |
          python site/tools/product_structure_review.py site review-evidence/structure
          python site/tools/product_structure_safety.py site review-evidence/safety
      - name: Verify migrated publication gates
        if: always()
        run: |
          python site/tools/hosted_smoke.py site
          python site/tools/copy_review.py site review-evidence/copy
      - name: Verify preserved workbench and six-entry workflows
        if: always()
        run: |
          WORKBENCH_SHELL_ONLY=1 python site/tools/workbench_coverage.py site
          python site/tools/six_paths_ui.py site
          python site/tools/quality_review.py site review-evidence/quality
          python site/tools/round2_review.py site review-evidence/round2
      - name: Verify Firefox and native 200 percent zoom
        if: always()
        run: xvfb-run -a python site/tools/browser_release_check.py site review-evidence/browser
      - name: Verify navigation contrast and preserved readers
        if: always()
        run: |
          python site/tools/nav_contrast.py site
          python site/tools/development_review_test.py site
          python site/tools/backend_logic_test.py site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-structure-review
          path: |
            review-evidence
            site/qa/hosted-smoke.json
            site/qa/hosted-theme-matrix.json
            site/qa/hosted-failures
            site/qa/complete-workbench/shell-report.json
            site/qa/six-paths-ui/results.json
            site/qa/nav-contrast
            site/qa/development-review
            site/qa/backend-logic/report.json
          retention-days: 14
