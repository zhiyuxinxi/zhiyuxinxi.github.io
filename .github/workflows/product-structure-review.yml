name: Review product structure candidate
on:
  push:
    branches: ['design/product-structure-*']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify canonical catalogs and local record contracts
        run: |
          python site/tools/build_workbench.py
          git diff --exit-code -- site/workbench-data.js
          node site/tools/record_loop_contract.mjs site
      - name: Verify current product structure and safety
        run: |
          python site/tools/product_structure_review.py site review-evidence/structure
          python site/tools/product_structure_safety.py site review-evidence/safety
      - name: Verify navigation contrast and preserved readers
        if: always()
        run: |
          python site/tools/nav_contrast.py site
          python site/tools/development_review_test.py site
          python site/tools/backend_logic_test.py site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-structure-review
          path: |
            review-evidence
            site/qa/nav-contrast
            site/qa/development-review
            site/qa/backend-logic/report.json
          retention-days: 14
