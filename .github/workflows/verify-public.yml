name: Verify public design URL
on:
  workflow_run:
    workflows: ['Publish design review']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  public-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify the actual published workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public-evidence
          python - <<'PY'
          import json,time,os,urllib.request,traceback,hashlib,subprocess,math
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('public-evidence');result={'url':'https://zhiyuxinxi.github.io/','passed':False,'checks':[],'verifiedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          try:
              req=urllib.request.Request('https://api.github.com/repos/zhiyuxinxi/zhiyuxinxi.github.io/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r: info=json.load(r)
              result['pagesConfiguration']={k:info.get(k) for k in ['status','build_type','html_url','source','https_enforced']}
          except Exception as e: result['pagesMetadataError']=str(e)
          try:
              result['resourceHashes']=[]
              for name in ['index.html','prototype/app.js','prototype/product.css','prototype/ui.css','prototype/experience-v3.js','workbench.js','workbench.css','development-review.js','prototype/views.js','prototype/components.js','prototype/assessment-preview.js','prototype/experience-v2.js','prototype/experience-v4.js','handoff/development/current-copy-contracts.json','prototype/index.html','prototype/product-context.js','prototype/decision-scenes.js','prototype/product-surface.js','prototype/flows-v2.js','workbench-data.js','handoff/routes.json','handoff/development/current-product-contracts.json','review/botanical-tree/index.html','review/botanical-tree/tree.css','review/botanical-tree/tree.js','review/botanical-tree/tree-layout.js'] + [str(p.relative_to(Path('site'))) for p in Path('site/review/botanical-tree/assets').glob('*.webp')]:
                  expected=hashlib.sha256((Path('site')/name).read_bytes()).hexdigest()
                  for attempt in range(6):
                      with urllib.request.urlopen(result['url']+name+'?resource_check='+str(time.time_ns()),timeout=20) as response: actual=hashlib.sha256(response.read()).hexdigest()
                      if actual==expected: break
                      time.sleep(5)
                  assert actual==expected,'Published resource differs: '+name
                  result['resourceHashes'].append({'path':name,'sha256':actual,'matched':True})
              with sync_playwright() as pw:
                  b=pw.chromium.launch(headless=True,args=['--no-sandbox']);p=b.new_page(viewport={'width':1500,'height':1280});errors=[];p.on('pageerror',lambda e:errors.append(str(e)))
                  for attempt in range(6):
                      response=p.goto(result['url']+'?verification='+str(int(time.time())),wait_until='networkidle',timeout=30000)
                      result['httpStatus']=response.status;result['title']=p.title()
                      if response.ok and p.locator('#product-frame').count(): break
                      time.sleep(8)
                  assert p.locator('#product-frame').count()==1,'Public root does not contain the delivered workbench'
                  p.wait_for_function("document.querySelector('#runtime-status').textContent.includes('原型已连接')",timeout=20000)
                  result['checks'].append('Public workbench and real iframe load successfully')
                  f=p.locator('#product-frame').element_handle().content_frame();assert f.locator('.home-assessment-start').count()==1 and f.locator('.home-assessment-start').is_disabled();assert f.evaluate('Object.keys(Views.map).length')==43
                  p.locator('.preview-tools > summary').click()
                  p.select_option('#theme-select','nebula');f.wait_for_function('App.snapshot.theme==="nebula"')
                  p.click('[data-page=explore]');f.wait_for_function('App.currentRoute==="explore"');assert f.locator('.decision-card').count()==8
                  result['checks'].append('Public tree navigation and full-theme switching work')
                  p.click('[data-mode=themes]');assert p.locator('#theme-gallery iframe').count()==8
                  result['checks'].append('Eight independent theme previews exist')
                  p.click('[data-mode=preview]');p.select_option('#theme-select','sunrise');p.click('[data-page=home]');f.wait_for_function('App.currentRoute==="home"');p.wait_for_timeout(350)
                  p.screenshot(path=str(out/'public-workbench.png'),full_page=True)
                  p.click('#expand-tree');p.click('[data-page=records]');f.wait_for_function('App.currentRoute==="records"');p.click('[data-mode=contract]');p.wait_for_function("document.querySelector('#dev-sections')?.textContent.includes('当前文案与本地行为补充')");p.fill('#dev-query','ZY-FR-011');assert 'ZY-FR-011' in p.locator('#dev-sections').inner_text();result['checks'].append('Current local behavior contract and requirement IDs are publicly readable');p.screenshot(path=str(out/'public-current-contract.png'))
                  p.set_viewport_size({'width':768,'height':1024});p.click('[data-mode=contract]');p.wait_for_selector('.dev-fields');p.screenshot(path=str(out/'public-contract-768.png'))
                  assert p.locator('#mobile-nav').is_visible()
                  p.set_viewport_size({'width':390,'height':844});p.click('[data-mode=logic]');p.wait_for_selector('#logic-rows .logic-item');p.screenshot(path=str(out/'public-logic-390.png'))
                  assert p.locator('.view-tabs').evaluate('e=>e.scrollWidth<=e.clientWidth')
                  p.goto(result['url']+'prototype/index.html?reset=1&theme=amber#assistant-chat');p.wait_for_function('window.App&&window.Ambient');p.locator('.source-btn').click();p.evaluate('Promise.all(document.querySelector(".overlay").getAnimations({subtree:true}).map(a=>a.finished))');p.evaluate('document.fonts.ready');p.wait_for_timeout(250);p.mouse.move(0,0);p.screenshot(path=str(out/'public-modal-amber.png'))
                  assert p.locator('.dialog').evaluate('e=>getComputedStyle(e).opacity')=='1'
                  assert p.locator('#notice').evaluate('e=>getComputedStyle(e).opacity')=='0'
                  result['checks'].append('Published tablet reader, phone destinations and solid modal verified')
                  for route,expected in [('memories','还没有确认的内容'),('simulation','设定一种假想性格'),('auth','账号服务暂不可用'),('support','反馈可下载为文本'),('report','还没有可查看的报告'),('assistant','我的画像'),('relationship-detail?id=D7','风险兜底'),('factor-detail?id=A','还没有这个角度的读数'),('observation-area?id=values','在意的事'),('assistant-chat?kind=relationship:D7:boundary','风险兜底 · 边界')]:
                      p.goto(result['url']+'prototype/index.html?reset=1&scenario=public-copy&theme=sunrise#'+route,wait_until='networkidle');assert expected in p.locator('main').inner_text();assert p.evaluate('document.documentElement.scrollWidth<=innerWidth');p.screenshot(path=str(out/('public-copy-'+route.split('?')[0]+'.png')),full_page=True)
                  result['checks'].append('Published copy corrections verified on ten key product pages')
                  subprocess.run(['python','site/tools/botanical_topology_review.py','--url',result['url']+'review/botanical-tree/','--quick','--output',str(out/'tree')],check=True)
                  result['treeChecks']=json.loads((out/'tree'/'report.json').read_text())
                  assert not Path('site/design-inputs').exists() and not Path('site/design-evidence').exists()
                  result['checks'].append('Generic tree: unmasked topology, 8/12 semantic depth, explanation popover, all anonymous nodes, camera/focus, touch and transparent labels verified at public URL')
                  result['browser']=b.version;result['consoleErrors']=errors;assert not errors,str(errors)
                  result['finalURL']=p.url;result['passed']=True;b.close()
          except Exception as e:result['error']=str(e);result['trace']=traceback.format_exc(limit=3)
          (out/'public-url-check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['passed']:raise SystemExit(1)
          PY
      - name: Verify published home and local explore interactions
        run: python site/tools/public_home_explore_review.py --url https://zhiyuxinxi.github.io/ --output public-evidence/home-explore
      - name: Verify published profile graphs
        run: python site/tools/public_profile_graph_review.py --url https://zhiyuxinxi.github.io/ --output public-evidence/profile-graphs
      - name: Keep public URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-url-verification
          path: public-evidence
          retention-days: 14
