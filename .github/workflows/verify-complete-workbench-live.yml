name: Verify published complete workbench
on:
  push:
    branches: [verify/zhiyu-complete-workbench-live]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify published runtime hashes match the approved candidate
        run: python site/tools/public_workbench_hashes.py
      - name: Verify public complete tree routes and actual workflows
        run: python site/tools/public_workbench_coverage.py site
      - name: Preserve exact public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-complete-workbench
          path: site/qa/public-complete-workbench
          retention-days: 14
