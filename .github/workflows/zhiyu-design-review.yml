name: Review Zhiyu design candidate
on:
  push:
    branches: [design/zhiyu-refinement, design/zhiyu-living-tide, design/zhiyu-six-paths, design/zhiyu-soft-fields, design/zhiyu-complete-workbench, design/quality-refinement-20261003]
permissions:
  contents: read
concurrency:
  group: zhiyu-design-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare fresh evidence and accepted reference
        run: |
          rm -rf site/qa
          mkdir -p "$RUNNER_TEMP/zhiyu-reference" review-evidence
          git archive 13015193daa878c2717cf623ae4419b5bf81e298 site | tar -x -C "$RUNNER_TEMP/zhiyu-reference"
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify theme generation and record contracts
        run: |
          python site/tools/build_themes.py
          python site/tools/build_workbench.py
          git diff --exit-code -- site/workbench-data.js
          node site/tools/record_loop_contract.mjs site
      - name: Verify native workflows
        run: python site/tools/hosted_smoke.py site
      - name: Capture and check the design candidate
        if: always()
        run: python site/tools/design_snapshots.py site
      - name: Verify persistent tide and full-cycle evidence
        if: always()
        run: python site/tools/tidal_motion.py site
      - name: Verify six-entry preview UI
        if: always()
        run: python site/tools/six_paths_ui.py site
      - name: Verify all twelve themes and four navigation states
        if: always()
        run: python site/tools/nav_contrast.py site
      - name: Verify complete workbench and all route theme shells
        if: always()
        run: python site/tools/workbench_coverage.py site
      - name: Verify both read-only document readers
        if: always()
        run: |
          python site/tools/development_review_test.py site
          python site/tools/backend_logic_test.py site
      - name: Capture final key states and keyboard behavior
        if: always()
        run: python site/tools/quality_review.py site review-evidence/after
      - name: Capture accepted reference and adjudicate static findings
        if: always()
        run: python site/tools/candidate_review_bundle.py site "$RUNNER_TEMP/zhiyu-reference/site" review-evidence
      - name: Preserve independent review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhiyu-design-candidate
          path: |
            site/qa
            review-evidence
          retention-days: 7
