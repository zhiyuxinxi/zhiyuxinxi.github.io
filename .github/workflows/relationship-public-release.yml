name: Verify published relationship artwork
on:
  push:
    branches: ['verify/relationship-public-20261005']
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 04c79e62f614b249057e21c546e6e434076b96ff
          path: published
      - uses: actions/checkout@v6
        with:
          ref: b63053da6ac526c33e702a8ba7c7e23cc7955f7e
          path: baseline
      - name: Install browser verification tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify exact published files and actual browser states
        run: python tools/relationship_public_release_check.py --source published/site --baseline baseline/site --output public-relationship-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-relationship-evidence
          path: public-relationship-evidence
          retention-days: 14
