name: Publish design review
on:
  push:
    branches: [main]
    paths: ['site/**', 'release/**', '.github/workflows/design-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: design-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check published source
        id: source
        run: |
          if test -f site/index.html; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo 'Design review source is being prepared; no placeholder deployed.'; fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.source.outputs.ready == 'true'
        with:
          path: site
      - name: Deploy
        if: steps.source.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
