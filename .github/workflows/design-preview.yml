name: Publish design review
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/design-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: design-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check complete source
        run: |
          test -f site/index.html
          test -f site/prototype/app.js
          test -f site/handoff/requirements-map.json
      - name: Install native browser verification environment
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify HTTP loading, native storage, themes and workflows
        id: verification
        run: |
          python site/tools/hosted_smoke.py site
          python site/tools/development_review_test.py site
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-verification
          path: site/qa
          retention-days: 14
      - name: Publish verified root entry for existing branch-based Pages
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          source=Path('site');published=[]
          allowed=['index.html','workbench.css','workbench.js','workbench-data.js','development-review.js','README.html','README.md','DESIGN.md','UX-CONTRACT.md','prototype','handoff','review','qa','tools','robots.txt','404.html','.nojekyll']
          for name in allowed:
              src=source/name;dst=Path(name)
              if not src.exists(): continue
              if src.is_dir(): shutil.copytree(src,dst,dirs_exist_ok=True)
              else: shutil.copy2(src,dst)
              published.append(name)
          Path('release').mkdir(exist_ok=True)
          Path('release/published-root-paths.json').write_text(json.dumps(published,indent=2))
          print('The same verified app is available at the repository root and in the Pages artifact.')
          PY
      - name: Commit source and verification records
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/qa
          if test -f release/published-root-paths.json; then
            python - <<'PY'
          from pathlib import Path
          import json,subprocess
          for name in json.loads(Path('release/published-root-paths.json').read_text()): subprocess.run(['git','add','--',name],check=True)
          PY
            git add release/published-root-paths.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified root entry and native browser evidence [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        if: success()
        with:
          path: site
      - name: Deploy verified design workbench
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm the actual public root
        if: success()
        run: |
          python - <<'PY'
          import time,json,urllib.request,hashlib
          from pathlib import Path
          url='https://zhiyuxinxi.github.io/'
          result={'url':url,'passed':False}
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url+'?release_check='+str(int(time.time())),timeout=20) as r: raw=r.read();result['httpStatus']=r.status
                  if b'id="product-frame"' in raw and b'workbench.js' in raw:
                      result.update(passed=True,entrySHA256=hashlib.sha256(raw).hexdigest());break
              except Exception as e:result['lastError']=str(e)
              time.sleep(8)
          Path('public-entry-check.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          if not result['passed']:raise SystemExit(1)
          PY
      - name: Keep actual public entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-entry-check
          path: public-entry-check.json
          if-no-files-found: ignore
          retention-days: 14
