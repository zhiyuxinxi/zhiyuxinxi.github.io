name: Publish design review
on:
  push:
    branches: [main]
    paths: ['site/**', 'release/manifest.json', '.github/workflows/design-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: design-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Materialize checksum-verified public source
        id: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,tarfile,io,urllib.request,json
          expected='66c30b71e61c06e244bf47b209b6ef8ca51b7708938cc21f24d5d64fcb31411b'
          target=Path('site');marker=target/'.release-sha';archive_path=Path('release/site.tar.xz')
          if not marker.exists() or marker.read_text().strip()!=expected:
              raw=archive_path.read_bytes() if archive_path.exists() else b''
              if hashlib.sha256(raw).hexdigest()!=expected:
                  fid='1EXLsAGxxYsEhArJ7roOkrg7WCGn9RFa-'
                  urls=[f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t',f'https://drive.google.com/uc?export=download&id={fid}']
                  errors=[]
                  for url in urls:
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'JIANJI-Design-Release/4'})
                          with urllib.request.urlopen(req,timeout=60) as response: raw=response.read(10000000)
                          if hashlib.sha256(raw).hexdigest()==expected: break
                          errors.append('Downloaded content failed SHA256 validation')
                      except Exception as exc: errors.append(str(exc))
                  if hashlib.sha256(raw).hexdigest()!=expected: raise RuntimeError('; '.join(errors))
              archive_path.parent.mkdir(exist_ok=True);archive_path.write_bytes(raw);target.mkdir(exist_ok=True)
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as archive:
                  members=archive.getmembers()
                  if sum(m.size for m in members)>50000000: raise ValueError('Unexpected archive size')
                  for entry in members:
                      if not entry.isfile() or entry.name.startswith('/') or '..' in Path(entry.name).parts: raise ValueError('Unsafe archive member')
                  archive.extractall(target,filter='data')
              marker.write_text(expected+'\n')
              Path('release/source.json').write_text(json.dumps({'version':'4.0.0-preservation','archiveSHA256':expected,'temporaryTransport':'Public design-only upload; archived here for independent rebuilds'},indent=2))
          if not (target/'index.html').exists(): raise RuntimeError('Missing real workbench entry')
          print('Complete public source verified; no placeholder content.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ready=true\n')
          PY
      - name: Persist source independently of temporary transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site release
          if ! git diff --cached --quiet; then
            git commit -m 'Store complete V4 design source and verified release archive [skip ci]'
            git push origin HEAD:main
          fi
      - name: Install native browser verification environment
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify HTTP loading, native storage, themes and workflows
        run: python site/tools/hosted_smoke.py site
      - name: Preserve browser verification evidence
        if: always() && steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-verification
          path: site/qa
          retention-days: 14
      - name: Commit readable verification results
        if: always() && steps.source.outputs.ready == 'true'
        run: |
          git add site/qa
          if ! git diff --cached --quiet; then
            git commit -m 'Record native browser checks for V4 design review [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        if: success()
        with:
          path: site
      - name: Deploy verified design workbench
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
